[project]
name = "art-finder"
version = "0.2.0"
description = "A Streamlit app to review and download artworks from museum APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "plotly>=5.18.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
art-finder = "app:main"
art-finder-api = "api:serve"

[tool.setuptools.packages.find]
include = ["art_finder*"]
